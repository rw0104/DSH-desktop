name: DSH Desktop Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build-windows:
    name: Build Windows x64 Setup installer
    runs-on: windows-latest
    steps:
      - name: Check out desktop and pinned upstream
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install locked dependencies
        shell: pwsh
        run: corepack yarn install --immutable

      - name: Build and verify unsigned Setup installer
        shell: pwsh
        run: corepack yarn dist:win

      - name: Sign and verify Windows artifacts
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $required = @{
            WINDOWS_SIGNING_CERTIFICATE_BASE64 = $env:WINDOWS_SIGNING_CERTIFICATE_BASE64
            WINDOWS_SIGNING_CERTIFICATE_PASSWORD = $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Missing protected Windows signing secret: $($entry.Key)"
            }
          }
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw 'signtool.exe is required on the Windows release runner.'
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'dsh-desktop-release-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $timestamp = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_TIMESTAMP_URL)) { 'http://timestamp.digicert.com' } else { $env:WINDOWS_SIGNING_TIMESTAMP_URL }
          $files = @(
            (Get-ChildItem -LiteralPath 'dsh-plugin-desktop/dist/win-unpacked/DSH Desktop.exe' -File),
            (Get-ChildItem -LiteralPath 'dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Setup.exe' -File)
          )
          foreach ($file in $files) {
            & $signtool sign /fd SHA256 /f $certificate /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr $timestamp /td SHA256 /d 'DSH Desktop' $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $($file.Name)" }
            & $signtool verify /pa /all $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($file.Name)" }
          }
          Remove-Item -LiteralPath $certificate -Force

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-windows-x64-${{ github.sha }}
          if-no-files-found: error
          path: |
            dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Setup.exe
            dsh-plugin-desktop/dist/latest.yml

  publish-release:
    name: Publish GitHub Release assets and notes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Check out tag metadata and release note
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: DSH-Desktop-windows-x64-${{ github.sha }}
          path: release-assets

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Missing task-oriented release note: $notes"
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "DSH Desktop $tag" --notes-file $notes --verify-tag
          } else {
            gh release edit $tag --title "DSH Desktop $tag" --notes-file $notes
          }
          $files = @(Get-ChildItem -LiteralPath release-assets -File)
          if ($files.Count -eq 0) {
            throw 'No release assets were downloaded.'
          }
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          $existing = @($release.assets | Where-Object { $_.name -in $files.Name })
          if ($existing.Count -gt 0) {
            throw "Release assets are immutable; refusing to replace: $($existing.name -join ', ')"
          }
          gh release upload $tag $files.FullName
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release asset upload failed.'
          }
          foreach ($file in $files) {
            $localDigest = "sha256:$((Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant())"
            $asset = $null
            for ($attempt = 0; $attempt -lt 5; $attempt += 1) {
              $published = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
              $asset = $published.assets | Where-Object name -eq $file.Name | Select-Object -First 1
              if ($null -ne $asset -and $null -ne $asset.digest) { break }
              Start-Sleep -Seconds 2
            }
            if ($null -eq $asset) {
              throw "Uploaded asset is missing from the release: $($file.Name)"
            }
            if ([int64]$asset.size -ne [int64]$file.Length) {
              throw "Uploaded asset size mismatch for $($file.Name): $($asset.size) != $($file.Length)"
            }
            if ($asset.digest -ne $localDigest) {
              throw "Uploaded asset digest mismatch for $($file.Name): $($asset.digest) != $localDigest"
            }
          }
